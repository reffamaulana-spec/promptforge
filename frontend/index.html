<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#06141b">
  <meta name="description" content="PROMPTFORGE adalah studio untuk membuat, memperbaiki, dan menyimpan prompt AI.">
  <title>PROMPTFORGE - Craft Better Prompts</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <button class="skip-link" type="button" id="skip-link">Lewati ke konten utama</button>

  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M8 4H5v16h3M16 4h3v16h-3"/><path d="M12 8l1.2 2.8L16 12l-2.8 1.2L12 16l-1.2-2.8L8 12l2.8-1.2z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><path d="M4 20L15 9"/><path d="M14 4v3M14 11v1M10 8h3M17 8h3M16.5 5.5l1.5-1.5M16.5 10.5l1.5 1.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M21 16l-5-5-8 8"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a8 8 0 0 1 16 0"/><path d="M12 18l4-5"/><circle cx="12" cy="18" r="1"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-languages" viewBox="0 0 24 24"><path d="M3 5h10M8 3v2M5 5c1 4 4 7 7 8M12 5c-1 4-4 7-8 9"/><path d="M13 21l4-10 4 10M14.5 18h5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8 8 0 1 1 21 12z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.5 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  </svg>

  <div id="auth-root" class="auth-root" hidden></div>

  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <a class="brand" href="#/dashboard" aria-label="PROMPTFORGE, ke Dashboard">
        <svg class="icon brand-mark" aria-hidden="true" focusable="false"><use href="#i-logo"></use></svg>
        <span class="brand-name">PROMPTFORGE</span>
      </a>
      <nav id="nav" class="nav" aria-label="Menu"></nav>
      <div class="sidebar-user" id="sidebar-user" hidden>
        <p class="sidebar-email" id="user-email"></p>
        <button class="btn btn-quiet btn-compact" id="logout-btn" type="button">Keluar</button>
      </div>
      <p class="sidebar-foot">Craft better prompts</p>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="content">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-toggle" type="button" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-menu"></use></svg>
        </button>
        <a class="topbar-brand" href="#/dashboard" aria-label="PROMPTFORGE, ke Dashboard">
          <svg class="icon brand-mark" aria-hidden="true" focusable="false"><use href="#i-logo"></use></svg>
          <span class="brand-name">PROMPTFORGE</span>
        </a>
        <div class="topbar-end">
          <span class="health" id="health" role="status">
            <span class="health-dot" id="health-dot"></span>
            <span id="health-text">Memeriksa server</span>
          </span>
          <a class="btn btn-primary btn-compact" href="#/workspace/new">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>
            <span class="topbar-btn-text">Prompt baru</span>
          </a>
        </div>
      </header>

      <div id="banners"></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <p class="noscript">PROMPTFORGE membutuhkan JavaScript. Aktifkan JavaScript di browser lalu muat ulang halaman ini.</p>
  </noscript>
</body>
</html>
